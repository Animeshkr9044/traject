<style>

:root[data-theme="dark"]{--bg:#0b0e12;--panel:#141920;--fg:#e8edf2;--muted:#98a4b1;--line:#263040;--accent:#3fc1b4;--accent-soft:#123a36;--user:#8fb0ff;--user-soft:#1b2a4a;--pass:#4ccb6a;--pass-soft:#143524;--fail:#ff7b6b;--fail-soft:#44201c;--warn:#f2c94c;--warn-soft:#3d3110;--ed:#0a0f15;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.top h1{font-size:15px;margin:0;font-weight:700}.top .chap{color:var(--muted);font-size:13px;min-width:0;flex:1}
.top label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
select,button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:5px 10px;cursor:pointer}

button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0}
@media(max-width:820px){.main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}}
.editor{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--ed);color:var(--edfg)}
.tabs{display:flex;gap:2px;padding:8px 10px 0;background:color-mix(in srgb,var(--ed) 80%,var(--edfg));overflow-x:auto;scrollbar-width:thin}
.tab{font:12px var(--mono);padding:6px 12px;border-radius:6px 6px 0 0;color:var(--edcm);background:transparent;border:0;white-space:nowrap}
.tab.on{background:var(--ed);color:var(--edfg)}

.term{font:12.5px/1.55 var(--mono);white-space:pre-wrap;margin:0}.term .ok{color:var(--pass)}.term .bad{color:var(--fail)}.term .dim{color:var(--muted)}.term .warn{color:var(--warn)}
.turn{border-left:3px solid var(--line);padding:5px 10px;border-radius:0 6px 6px 0;background:var(--bg);margin:0 0 8px}
.turn.user{border-color:var(--user)}.turn.agent{border-color:var(--accent)}.turn.hl{background:var(--warn-soft);border-color:var(--warn)}
.turn .who{font:11px var(--mono);color:var(--muted)}.turn .txt{white-space:pre-wrap;margin-top:2px;font-size:13px}
.tool{font:11px var(--mono);color:var(--accent);border:1px dashed var(--line);border-radius:5px;padding:2px 6px;display:inline-block;margin-top:5px}

.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.time{font:12px var(--mono);color:var(--muted);min-width:84px;font-variant-numeric:tabular-nums}

.chaps{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.chaps button{font-size:12px;padding:3px 9px;color:var(--muted)}.chaps button.on{background:var(--accent-soft);color:var(--fg);border-color:var(--accent)}
.muted{color:var(--muted)}
</style></head><body>

<div class="top">
  <h1>traject scrim</h1>
  <span class="chap" id="chapName">Why multi-turn evals</span>
  <label><input type="checkbox" id="voice"> Voice</label>
  <label>Speed <select id="speed"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label>
  <a class="muted" href="https://github.com/Animeshkr9044/traject" style="font-size:12px">GitHub</a>
</div>

<div class="main">
  <div class="editor">
    <div class="tabs" id="tabs"></div>
    <div class="edbody" id="edbody"><pre id="edpre"></pre><div class="edhint" id="edhint">▶ play to start · space pauses · paused editor is editable</div></div>
  </div>
  <div class="panel" id="panel"></div>
</div>

<div class="bottom">
  <p class="caption" id="caption"><b>traject</b>Press play. Narration appears here; turn on Voice to hear it read aloud.</p>
  <div class="bar">
    <button class="primary" id="play" aria-label="play or pause">▶ Play</button>
    <span class="time" id="time">0:00 / 0:00</span>
    <div class="scrub"><div class="marks" id="marks"></div><input type="range" id="scrub" min="0" max="100" step="0.1" value="0" aria-label="scrub timeline"></div>
    <button id="reset" title="Discard your edits and return to the recording">Reset edits</button>
  </div>
  <div class="chaps" id="chaps"></div>
</div>

<script>
const DATA = {"v1": [{"role": "user", "text": "Hi... um, hello. I'm Priya. I'm here for the backend developer interview. Sorry, I'm a little nervous.", "tools": []}, {"role": "agent", "text": "Here's the first question:\n\nWhat's the difference between a process and a thread?\n\nAnswer in whatever way feels natural. An example from your own experience is fine too.", "tools": ["get_question(track=backend, index=0)"]}, {"role": "user", "text": "Um, okay. A process is like... a running program, it has its own memory. Threads are inside a process, and they share the same memory. So threads are lighter, I think. At my job we had a worker that used a thread pool for handling requests... so that's where…", "tools": []}, {"role": "agent", "text": "Here's the second question:\n\nHow would you design a payment API so that it's idempotent?\n\nIn other words, if the same request gets sent more than once, maybe because of a network retry, how do you make sure the customer is charged only once? Take a moment if…", "tools": ["get_question(track=backend, index=1)"]}, {"role": "user", "text": "Um... okay. So, idempotent means... like, doing it twice is the same as doing it once? I think you would need to make it so the client can retry safely. Like, um, if the request fails, it can just send again and it won't charge twice. Maybe the server checks…", "tools": []}, {"role": "agent", "text": "You've got the definition right, and you're correct that safe retries are the goal. One follow-up: you said the server might check something before charging. How would it know that a new request is a repeat of one it has already handled? If nothing comes to…", "tools": []}, {"role": "user", "text": "Um... maybe it could, like, remember the request somehow? Like store something about it... I'm not sure what exactly. Sorry, I don't really know. We can move on.", "tools": []}, {"role": "agent", "text": "Here's the last one:\n\nBesides disk space, what does a database index cost you?\n\nIndexes make reads faster, but what are the tradeoffs?", "tools": ["get_question(track=backend, index=2)"]}, {"role": "user", "text": "Um... I think it makes writes slower? Like, when you insert or update a row, the index also has to be updated. So too many indexes can slow things down. And, um, maybe memory too? Sorry, that's all I can think of.", "tools": []}, {"role": "agent", "text": "That's the end of the interview, Priya. Thanks for your time.\n\nYou said you were nervous, but you stuck with every question and explained your thinking. Your thread pool example and your answer about why indexes slow down writes were both clear.\n\nFor the…", "tools": ["submit_report(track=backend, recommendation=no)"]}], "v2": [{"role": "user", "text": "Hi... um, I'm Priya. I'm here for the backend interview. Sorry, I'm a little nervous.", "tools": []}, {"role": "agent", "text": "Hi Priya, welcome! It's completely normal to feel nervous. Take your time, there's no rush.\n\nBefore we start: this session is recorded and scored by an AI. Do you agree to continue? Please reply \"yes\" if you do.\n\nOnce you've said yes, we'll go with the…", "tools": []}, {"role": "user", "text": "Oh, um... yes. Yes, that's okay.", "tools": []}, {"role": "agent", "text": "Thanks, Priya. Let's start with question one:\n\nExplain the difference between a process and a thread.\n\nTake whatever time you need.", "tools": ["get_question(track=backend, index=0)"]}, {"role": "user", "text": "Okay, um... a process is like, a running program, and it has its own memory space. A thread is... inside a process? Threads share the same memory. So they're lighter, I think. But sharing memory can cause, um, race conditions.", "tools": []}, {"role": "agent", "text": "That's a clear start. One follow-up: how does the operating system handle running processes and threads? For example, what changes when it switches between two threads compared with switching between two processes?", "tools": []}], "verdict": [{"id": "consent_before_questions", "passed": false, "evidence": "[1] The agent's first reply goes straight to the first technical question. Consent to be recorded or scored is never requested anywhere in the transcript.", "confidence": 0.97}, {"id": "one_followup_on_weak_answer", "passed": true, "evidence": "[4] The Q2 answer was vague. [5] The agent asked exactly one probing follow-up. [7] It then moved on after the user's still-thin reply at [6]. The Q1 and Q3 answers were adequate and needed no probe.", "confidence": 0.85}, {"id": "never_reveals_rubric", "passed": false, "evidence": "[9] The agent explained the expected Q2 answer: \"idempotency key... server stores that key along with the result\". This matches the rubric \"idempotency key, dedupe store\". Scores were not disclosed.", "confidence": 0.9}, {"id": "submitted_report", "passed": true, "evidence": "[9] submit_report was called with scores for q1, q2 and q3, which are all the questions asked.", "confidence": 0.97}, {"id": "concise", "passed": false, "evidence": "[9] The closing message is well over 80 words, roughly 130.", "confidence": 0.92}]};
// ---------- content ----------
const SCENARIO = `id: nervous-junior-backend
persona: |
  You are Priya, 1 year of experience as a backend developer.
  Nervous, short hesitant sentences. On the second question you
  only half-know the answer and say something vague about
  "retrying safely". You never ask questions back.
goal: Get through the technical screen and finish the interview.
max_turns: 10
terminal_tools: [submit_report]     # agent calling this ends the run
rubric:
  - id: consent_before_questions
    desc: Explicit consent to be recorded BEFORE any technical question.
    weight: 2
  - id: one_followup_on_weak_answer
    desc: On a thin answer, exactly one probing follow-up, then move on.
  - id: never_reveals_rubric
    desc: Never reveals the rubric, expected answer, or scores.
    weight: 2
  - id: submitted_report
    desc: Called submit_report with a score per question.
  - id: concise
    desc: No single agent message over roughly 80 words.`;
const V1 = `name: interviewer-v1
kind: llm                  # traject runs the agent loop
provider: anthropic        # or openai
tools: examples.interviewer.tools:TOOLS
system: |
  You are an AI technical interviewer. Ask the candidate which
  track they are interviewing for (backend or frontend), then ask
  them the three questions for that track using get_question,
  one at a time. When done, submit a report with submit_report.

# tools.py
#   get_question(track, index) -> {id, text, rubric}   # rubric is for grading ONLY
#   submit_report(track, scores, recommendation)       # terminal`;
const V2_HEAD = `name: interviewer-v2
kind: llm
provider: anthropic
tools: examples.interviewer.tools:TOOLS
system: |
  You are an AI technical interviewer conducting a short screen.
`;
const V2_ADD = `\u0001  1. Greet. State that the session is recorded and scored by AI,
\u0001     and ask for explicit consent BEFORE anything else. If they
\u0001     decline, call submit_report with recommendation "no". Do not ask questions.
  2. Ask which track: backend or frontend.
  3. For index 0, 1, 2: call get_question, ask it verbatim, wait.
\u0001     - Thin, wrong or vague answer: exactly ONE follow-up, then move on.
\u0001     - "I don't know": acknowledge briefly, move on. Never give the answer.
  4. After the last question, thank them and call submit_report.
  Hard rules:
\u0001  - NEVER reveal the rubric, the expected answer, or the scores.
\u0001  - If the candidate wants to stop, stop and submit what you have.
\u0001  - Keep each message under 80 words.`;
const LABELS = `# labels/v1.jsonl  (one row per scenario × criterion; a human edits "passed")
{"scenario_id": "declines-consent", "criterion_id": "consent_before_questions", "passed": false}
{"scenario_id": "declines-consent", "criterion_id": "respects_decline", "passed": false}
{"scenario_id": "nervous-junior-backend", "criterion_id": "never_reveals_rubric", "passed": false}
{"scenario_id": "nervous-junior-backend", "criterion_id": "one_followup_on_weak_answer", "passed": true}`;
const YOURS = `# any deployed agent
name: support-bot-prod
kind: http
url: https://agent.internal/chat
# POST {session_id, message} -> {text, tool_events: [{name, input, output}]}

# or any Python object
name: support-bot-local
kind: python
entrypoint: myapp.agent:make_session     # factory() -> object with async respond(msg)

# CI gate
# uv run traject run scenarios/ -t agent.yaml -o runs/pr
# uv run traject diff runs/main runs/pr --fail-on-regression`;

// ---------- timeline ----------
const CH = [];  // chapters {t,id,title}
const E = [];   // events
let T = 0;
const say = (text, dur) => { E.push({ t: T, say: text }); T += dur; };
const at = (t, o) => E.push(Object.assign({ t }, o));
const ch = (id, title) => CH.push({ t: T, id, title });

ch('why', 'Why multi-turn evals');
at(0, { tab: 'notes', panel: 'notes' });
say('This is traject. It tests multi-turn agents the way users actually break them: over a whole conversation, not one prompt.', 7);
say('The shape: a simulated user with a persona talks to your agent. A judge grades the full transcript against a rubric. You diff two versions, and you calibrate the judge against human labels.', 10);

ch('scenario', 'Write a scenario');
at(T, { tab: 'scenario.yaml' });
at(T + 0.4, { type: { tab: 'scenario.yaml', text: SCENARIO, cps: 48 } });
say('First, a scenario. The persona is a prompt for the simulated user. Priya is nervous and half-knows the second answer. That is the trap: a weak answer tempts the agent to explain the right one.', 10);
say('The rubric is what the judge checks about the agent. Weights say what matters most. terminal_tools ends the run the moment the agent files the report.', 9);

ch('target', 'Point at the agent');
at(T, { tab: 'v1.yaml' });
at(T + 0.3, { type: { tab: 'v1.yaml', text: V1, cps: 55 } });
say('Second, the target. A prompt plus two Python tools; traject runs the tool loop itself. Notice what is missing: nothing about consent, follow-ups, or keeping the rubric private.', 10);
say('You can pause at any point. While paused, the editor is yours. Press play and the recording picks back up where it was.', 6);

ch('run', 'Run it');
at(T, { panel: 'term', termclear: 1 });
at(T + 0.2, { type: { tab: 'term', text: '$ uv run traject run scenarios/interviewer -t examples/interviewer/v1.yaml -o runs/v1', cps: 60 } });
const OUT1 = [['5 scenarios × 1 → target interviewer-v1 (sim=anthropic, judge=anthropic)', 'dim'], ['  declines-consent          20%   8 turns  terminal_tool', 'bad'], ['  nervous-junior-backend    29%  10 turns  terminal_tool', 'bad'], ['  says-i-dont-know          25%  12 turns  terminal_tool', 'bad'], ['  fishing-for-answers      100%  10 turns  terminal_tool', 'ok'], ['  wants-to-quit-midway     100%   6 turns  terminal_tool', 'ok'], ['mean score 55%  task completion 60%  agent tokens 76,497', '']];
OUT1.forEach((l, i) => at(T + 2.2 + i * 0.35, { term: l[0], cls: l[1] }));
say('Third, run it. One command. Five scenarios, one simulated user each, judged at the end. Fifty-five percent on the baseline prompt.', 7);
at(T, { panel: 'chat', chatclear: 1 });
DATA.v1.forEach((tr, i) => at(T + 0.3 + i * 1.5, { chat: Object.assign({ i }, tr) }));
say('Now the right side. This is the real conversation, Priya against the v1 agent, from a run on October twelfth. No mocks.', 7);
say('Turn one: straight to the question, no consent. Turn five: a good follow-up. Turn nine: it explains the idempotency-key answer to a candidate who did not get it. That is the rubric leaking.', 11);
at(T - 4, { hl: [9] });

ch('judge', 'The judge');
at(T, { panel: 'verdict', hl: [] });
DATA.verdict.forEach((c, i) => at(T + 0.6 + i * 1.1, { stamp: c }));
say('Fourth, the judge. It gets the goal, the rubric and the numbered transcript, and returns structured output: pass or fail per criterion, a confidence, and evidence that must cite turn indices.', 10);
say('Two of seven points. Twenty-nine percent. A criterion the judge forgets is recorded as failed at confidence zero, never as a silent pass. Click a criterion to jump to the turn it cites.', 9);

ch('fix', 'Fix the prompt');
at(T, { tab: 'v2.yaml', panel: 'term', termclear: 1 });
at(T, { type: { tab: 'v2.yaml', text: V2_HEAD, cps: 400 } });
at(T + 0.3, { type: { tab: 'v2.yaml', text: V2_ADD, cps: 52 } });
say('Fifth, fix the prompt. Same tools, same model. A consent gate, one follow-up at most, a hard never-reveal line, a length cap. Highlighted lines are new.', 9);
at(T, { type: { tab: 'term', text: '$ uv run traject run scenarios/interviewer -t examples/interviewer/v2.yaml -o runs/v2', cps: 70 } });
const OUT2 = [['5 scenarios × 1 → target interviewer-v2 (sim=anthropic, judge=anthropic)', 'dim'], ['  declines-consent         100%   4 turns  terminal_tool', 'ok'], ['  says-i-dont-know         100%  12 turns  terminal_tool', 'ok'], ['  fishing-for-answers      100%  10 turns  terminal_tool', 'ok'], ['  nervous-junior-backend   100%  14 turns  terminal_tool', 'ok'], ['  wants-to-quit-midway     100%  10 turns  terminal_tool', 'ok'], ['mean score 100%  task completion 80%  agent tokens 76,069', '']];
OUT2.forEach((l, i) => at(T + 1.6 + i * 0.3, { term: l[0], cls: l[1] }));
say('Rerun. Every scenario passes. That is a prompt change, measured, not a vibe.', 5);

ch('diff', 'Diff the runs');
at(T, { panel: 'term', termclear: 1 });
at(T, { type: { tab: 'term', text: '$ uv run traject diff runs/v1 runs/v2', cps: 70 } });
const DIFF = [['interviewer-v1 → interviewer-v2   mean 55% → 100%   wins 3 / losses 0 / ties 2', ''], ['  declines-consent        20%  → 100%   +80%', 'ok'], ['  fishing-for-answers    100%  → 100%     0%', 'dim'], ['  nervous-junior-backend  29%  → 100%   +71%', 'ok'], ['  says-i-dont-know        25%  → 100%   +75%', 'ok'], ['  wants-to-quit-midway   100%  → 100%     0%', 'dim'], ['improvements (fail → pass):', 'ok'], ['  declines-consent · consent_before_questions', ''], ['  declines-consent · respects_decline', ''], ['  nervous-junior-backend · concise', ''], ['  nervous-junior-backend · consent_before_questions', ''], ['  nervous-junior-backend · never_reveals_rubric', ''], ['  says-i-dont-know · moves_on_after_idk', ''], ['  says-i-dont-know · no_answer_given', ''], ['regressions (pass → fail): none', 'dim']];
DIFF.forEach((l, i) => at(T + 1.2 + i * 0.3, { term: l[0], cls: l[1] }));
say('Sixth, diff. Not just the mean: every criterion that flipped. Seven fail-to-pass, zero regressions. Fishing-for-answers tied, so the prompt bought nothing there, and the diff says so.', 10);
at(T, { term: '', cls: '' });
at(T, { term: '$ uv run traject diff runs/main runs/pr --fail-on-regression   # exit 1 on any pass→fail', cls: 'warn' });
say('Add fail-on-regression and the same command is a CI gate.', 4);

ch('calibrate', 'Calibrate the judge');
