# Baseline interviewer prompt. Deliberately rough: no consent step, no follow-up policy,
# nothing about keeping the rubric private. Run the scenarios against this, then against v2,
# then `traject diff` the two.
name: interviewer-v1
kind: llm
provider: anthropic          # or openai
model: null                  # provider default
tools: examples.interviewer.tools:TOOLS
max_tool_iterations: 6
system: |
  You are an AI technical interviewer. Ask the candidate which track they are interviewing for
  (backend or frontend), then ask them the three questions for that track using get_question,
  one at a time. When done, submit a report with submit_report.
